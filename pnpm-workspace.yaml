allowBuilds:
  sharp: true
  unrs-resolver: true
  esbuild: true
  "@embedded-postgres/darwin-arm64": true
  # Встроенная база нужна только для разработки на Mac; на Linux (сервер, CI, Docker) её скрипты не запускаем.
  "@embedded-postgres/linux-arm64": false
  "@embedded-postgres/linux-x64": false
overrides:
  undici@>=7.0.0 <7.29.1: ">=7.29.1"
auditConfig:
  # braces: только сборка стилей (sass), в рабочий код не попадает; исправления нет. Пересмотреть при обновлении Next.js.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
