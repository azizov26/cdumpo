name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # База для Payload: сборка читает новости и настройки, e2e создаёт и удаляет временные записи.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cdumpo
          POSTGRES_PASSWORD: cdumpo
          POSTGRES_DB: cdumpo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cdumpo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URI: postgres://cdumpo:cdumpo@localhost:5432/cdumpo
      PAYLOAD_SECRET: ci-only-not-a-real-secret-0000000000000000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6 # версия pnpm — из поля packageManager в package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-secrets.mjs --all # ключей и паролей в репозитории быть не должно
      - run: pnpm audit --prod --audit-level=high # известные уязвимости зависимостей
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm migrate # схема базы — только миграциями, как на проде
        env:
          NODE_ENV: production
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e # сценарии посетителя и доступность (axe) по продакшен-сборке
