<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Небо над Пензой — экраны для вёрстки</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/sky.css">
<link rel="stylesheet" href="css/hero.css">
<style>
html,body{margin:0;background:#D9D3C7;font-family:var(--f-ui);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.frame{margin:40px;display:inline-block;vertical-align:top}
.frame>.cap{font:600 13px/1.4 var(--f-ui);color:#5C5F6B;margin:0 0 10px;letter-spacing:.04em}
.phone-shell{border-radius:48px;overflow:hidden;box-shadow:var(--sh-float)}
.desk-shell{border-radius:16px;overflow:hidden;box-shadow:var(--sh-float)}

/* ---- Компьютер ниже первого экрана (светлая тема) ---- */
.below{width:1440px;background:var(--c-paper);color:var(--c-ink)}
.wrap{width:1200px;margin:0 auto}
.sec{padding:96px 0 0}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px}
.h2{font-family:var(--f-display);font-weight:500;font-size:52px;line-height:1.02;margin:8px 0 0}
.h2 em{font-style:italic;color:var(--c-goldtx)}
.lead{font-size:17px;line-height:1.55;color:var(--c-muted);margin:14px 0 0}
.link{font-size:14.5px;font-weight:600;color:var(--c-goldtx);display:inline-flex;align-items:center;gap:6px}
.link svg{width:18px;height:18px}
.const-panel{border-radius:28px;background:radial-gradient(120% 90% at 70% 60%,#1B2658 0%,#0B1636 70%);color:var(--c-light);display:grid;grid-template-columns:440px 1fr;gap:20px;padding:56px;position:relative;overflow:hidden}
.const-panel .label{color:var(--c-gold-soft)}
.stat{border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(247,241,230,.12);padding:16px 18px}
.stat .k{font-size:12.5px;color:rgba(247,241,230,.62)}
.stat .v{font-family:var(--f-display);font-weight:600;font-size:44px;line-height:1.1;color:#FBEBD2}
.news{display:grid;grid-template-columns:1.25fr 1fr;gap:28px}
.news .big{border-radius:24px;overflow:hidden;background:#fff;border:1px solid var(--c-line)}
.news .item{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--c-line)}
.news .item .th{height:84px;border-radius:14px;overflow:hidden}
.meta{font-size:12.5px;color:var(--c-muted);display:flex;gap:10px;align-items:center}
.ttl{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.12;margin-top:6px}
.dates{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.date-card{border-radius:20px;background:#fff;border:1px solid var(--c-line);padding:22px}
.date-card .d{font-family:var(--f-display);font-weight:600;font-size:52px;line-height:1}
.date-card .m{font-size:12.5px;color:var(--c-muted);margin-top:4px;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.date-card .t{font-size:15.5px;font-weight:600;margin-top:18px}
.date-card.hl{background:var(--c-night);color:var(--c-light);border-color:var(--c-night)}.date-card.hl .m{color:rgba(247,241,230,.6)}.date-card.hl .d{color:var(--c-gold-soft)}
.mosq{display:grid;grid-template-columns:420px 1fr;gap:32px;align-items:stretch}
.mufti{display:grid;grid-template-columns:280px 1fr;gap:48px;align-items:center;border-radius:28px;background:var(--c-panel);padding:48px}
.portrait{width:280px;height:340px;border-radius:24px;background:linear-gradient(170deg,#3D2D5E,#D9805A 70%,#F2B57C);display:flex;align-items:flex-end;justify-content:center;color:rgba(255,248,236,.7);font-size:13px;padding-bottom:16px}
.quote{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:34px;line-height:1.25}
.foot{margin-top:96px;background:var(--c-night);color:var(--c-light);padding:64px 0 40px}
.fcols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px}
.fcols h5{margin:0 0 14px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--c-gold-soft)}
.fcols a{display:block;font-size:14.5px;color:rgba(247,241,230,.78);text-decoration:none;line-height:2}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

<symbol id="i-sadaqa" viewBox="0 0 24 24"><polygon points="12.00,2.50 14.78,5.28 18.72,5.28 18.72,9.22 21.50,12.00 18.72,14.78 18.72,18.72 14.78,18.72 12.00,21.50 9.22,18.72 5.28,18.72 5.28,14.78 2.50,12.00 5.28,9.22 5.28,5.28 9.22,5.28"/><circle cx="12" cy="12" r="2.2"/></symbol>
<symbol id="i-light-star" viewBox="0 0 24 24"><polygon points="12.00,2.50 14.78,5.28 18.72,5.28 18.72,9.22 21.50,12.00 18.72,14.78 18.72,18.72 14.78,18.72 12.00,21.50 9.22,18.72 5.28,18.72 5.28,14.78 2.50,12.00 5.28,9.22 5.28,5.28 9.22,5.28"/><path d="M12 8.5v7M8.5 12h7"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
<symbol id="i-qibla" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>

<symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 11l7.6-4M8.2 13l7.6 4"/></symbol>

<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .7 3 2.8 3 6"/></symbol>
<symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></symbol>
<symbol id="i-sbp-qr" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/></symbol>

<div id="root"></div>

<script src="js/sky-lib.js"></script>
<script>
const STATES=[
 ['dawn','Рассвет · Фаджр → восход','До восхода солнца','الشروق','Восход в 06:33',1],
 ['day','День · восход → Аср','До послеполуденной молитвы','العصر','Аср в 14:23',3],
 ['asr','Золотой час · Аср → Магриб−60','До вечерней молитвы','المغرب','Магриб в 17:01',4],
 ['evening','Закат · Магриб−60 → Иша','До вечерней молитвы','المغرب','Магриб в 17:01',4],
 ['night','Ночь · Иша → Фаджр','До утренней молитвы','الفجر','Фаджр в 05:03',0]];
const P=[['Фаджр','05:02'],['Восход','06:33'],['Зухр','11:47'],['Аср','14:23'],['Магриб','17:01'],['Иша','18:41']];
const TABS=[['today','Сегодня'],['namaz','Намаз'],['mosques','Мечети'],['dobro','Добро'],['more','Ещё']];
const ic=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const logo=()=>`<svg class="logo" viewBox="-22 -22 44 44" fill="none" stroke="currentColor"><circle r="20" stroke-width="1.3"/><polygon points="${starPts(15)}" stroke-width="1.7"/><circle r="4.5" fill="currentColor" stroke="none"/></svg>`;
const prayers=on=>`<div class="prayers">${P.map(([n,v],i)=>`<div class="c${i===on?' on':''}"><span class="n">${n}</span><span class="v">${v}</span></div>`).join('')}</div>`;
const root=document.getElementById('root');

/* ---- телефоны ---- */
let h='<div>';
STATES.forEach(([st,cap,until,ar,next,on])=>{const light=SKY[st].theme==='light';
 h+=`<div class="frame"><div class="cap">ТЕЛЕФОН 390×844 · ${cap}</div><div class="phone-shell"><section class="sky hero-m" data-sky="${st}" id="m-${st}">
  <svg class="layer" width="390" height="844" viewBox="0 0 390 844" data-draw="${st}" data-frame="phone"></svg>
  <header class="hdr"><div class="brand">${logo()}<div class="t">ЦДУМ<br>Пензенской области</div></div><span class="pill">Пенза ${ic('chevron-down')}</span></header>
  <div class="center"><div class="date">Среда, 14 октября<br>3 джумада-ль-уля 1448</div><div class="until">${until}</div><div class="count">01:12:40</div><div class="ar-name">${ar}</div><div class="next">${next}</div></div>
  ${prayers(on)}
  <nav class="tabbar${light?' light':''}">${TABS.map(([i,n],k)=>`<a href="#" class="${k===0?'on':k===3?'don':''}">${ic(i)}${n}</a>`).join('')}</nav>
 </section></div></div>`});
h+='</div><div>';
/* ---- компьютеры ---- */
STATES.forEach(([st,cap,until,ar,next,on])=>{
 h+=`<div class="frame"><div class="cap">КОМПЬЮТЕР 1440×900 · ${cap}</div><div class="desk-shell"><section class="sky hero-d" data-sky="${st}" id="d-${st}">
  <svg class="layer" width="1440" height="900" viewBox="0 0 1440 900" data-draw="${st}" data-frame="desktop"></svg>
  <header class="hdr"><div class="brand">${logo()}<div class="t">Централизованное духовное управление<br>мусульман Пензенской области</div></div>
   <nav><span>Намаз</span><span>Мечети</span><span>Добро</span><span>Знания</span><span>Жизнь уммы</span><span>Муфтият</span></nav>
   <div class="actions"><span class="pill">Пенза ${ic('chevron-down')}</span><span class="btn btn-gold" style="height:46px">${ic('light-star')}Зажечь звезду</span></div></header>
  <div class="center"><div class="date">Пенза · среда, 14 октября · 3 джумада-ль-уля 1448</div><div class="until">${until}</div><div class="count">01:12:40</div><div class="ar-name">${ar}</div><div class="next">${next}</div></div>
  <div class="row">${prayers(on)}<div class="qa">${ic('mosques')}Мечети рядом</div><div class="qa">${ic('ask-imam')}Вопрос имаму</div><div class="qa">${ic('rites')}Обряды</div><div class="qa gold">${ic('light-star')}Небо добрых дел</div></div>
 </section></div></div>`});
h+='</div>';

/* ---- компьютер ниже первого экрана ---- */
h+=`<div class="frame"><div class="cap">КОМПЬЮТЕР 1440 · ГЛАВНАЯ НИЖЕ ПЕРВОГО ЭКРАНА · светлая тема (день). Тексты — образцы для вёрстки</div><div class="desk-shell"><div class="below" data-theme="light" id="below">
 <div class="wrap sec" style="padding-top:80px">
  <div class="const-panel">
   <div style="position:relative;z-index:2">
    <div class="label">Строим всем миром</div>
    <div class="h2" style="color:#FFF8EC">Соборная мечеть <em style="color:#F6CF96">Пензы</em></div>
    <p class="lead" style="color:rgba(255,248,236,.75)">Каждое пожертвование зажигает звезду. Созвездие собирается снизу вверх — от фундамента к куполу и полумесяцу.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px"><div class="stat"><div class="k">Звёзд зажжено</div><div class="v">[N] <span style="font-size:22px;color:rgba(255,248,236,.5)">из 120</span></div></div><div class="stat"><div class="k">Собрано</div><div class="v">[%]</div></div></div>
    <div style="display:flex;gap:12px;margin-top:28px"><span class="btn btn-gold">${ic('light-star')}Зажечь звезду</span><span class="btn btn-line">Отчёт о стройке</span></div>
   </div>
   <svg id="belowConst" width="600" height="440" viewBox="0 0 600 440" style="align-self:center;justify-self:end"></svg>
  </div>
 </div>
 <div class="wrap sec">
  <div class="sec-h"><div><div class="label">Новости · видео · фото</div><div class="h2">Жизнь <em>уммы</em></div></div>
   <div style="display:flex;gap:8px;align-items:center"><span class="chip on">Все</span><span class="chip">Муфтият</span><span class="chip">Соборная мечеть</span><span class="chip">Видео</span><span class="chip">Фото</span><span class="link" style="margin-left:16px">Все новости ${ic('arrow-right')}</span></div></div>
  <div class="news">
   <div class="big"><svg class="ph" data-ph="dawn" width="100%" height="320" viewBox="0 0 640 320" preserveAspectRatio="xMidYMid slice"></svg>
    <div style="padding:24px 28px 28px"><div class="meta"><span class="chip">Рубрика</span><span>Дата публикации</span></div><div class="ttl" style="font-size:32px">Заголовок главной новости — пример длины в две строки для вёрстки</div><p class="lead" style="font-size:15px;margin-top:10px">Первые строки текста новости. Две-три строки, затем многоточие, чтобы карточка держала высоту.</p></div></div>
   <div>${[['evening','Видео'],['asr','Рубрика'],['night','Рубрика'],['day','Фото']].map(([s,r])=>`<div class="item"><div class="th"><svg class="ph" data-ph="${s}" width="120" height="84" viewBox="0 0 240 168" preserveAspectRatio="xMidYMid slice"></svg></div><div><div class="meta"><span class="chip">${r}</span><span>Дата</span></div><div class="ttl" style="font-size:21px">Заголовок новости — пример в две строки</div></div></div>`).join('')}</div>
  </div>
 </div>
 <div class="wrap sec">
  <div class="sec-h"><div><div class="label">Календарь хиджры</div><div class="h2">Ближайшие <em>даты</em></div></div><span class="btn btn-line" style="height:46px">${ic('calendar')}Добавить в календарь</span></div>
  <div class="dates">
   <div class="date-card"><div class="d">00</div><div class="m">месяц · день недели</div><div class="t">Джума-намаз</div><div class="meta" style="margin-top:6px">Подпись события</div></div>
   <div class="date-card"><div class="d">≈00</div><div class="m">месяц</div><div class="t">Начало месяца</div><div class="meta" style="margin-top:6px">Дата по хиджре</div></div>
   <div class="date-card"><div class="d">≈00</div><div class="m">месяц</div><div class="t">Памятная ночь</div><div class="meta" style="margin-top:6px">Дата по хиджре</div></div>
   <div class="date-card hl"><div class="d">≈00</div><div class="m">месяц</div><div class="t">Рамадан</div><div class="meta" style="margin-top:6px;color:rgba(247,241,230,.6)">Обратный отсчёт</div></div>
  </div>
 </div>
 <div class="wrap sec">
  <div class="mosq">
   <div><div class="label">Мечети и общины</div><div class="h2">Мечеть рядом — <em>в два касания</em></div><p class="lead">Карта всех мечетей области: адрес, джума, имам, удобства и маршрут.</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:22px"><span class="chip on">Пенза</span><span class="chip">Город</span><span class="chip">Село</span><span class="chip">Село</span><span class="chip">Город</span></div>
    <div style="display:flex;gap:12px;margin-top:28px"><span class="btn btn-night">${ic('mosques')}Открыть карту</span><span class="btn btn-line">Найти ближайшую</span></div></div>
   <div style="border-radius:28px;overflow:hidden;height:460px"><svg id="belowMap" width="748" height="460" viewBox="0 0 748 460"></svg></div>
  </div>
 </div>
 <div class="wrap sec">
  <div class="mufti"><div class="portrait">фото муфтия</div>
   <div><div class="label">Слово муфтия</div><div class="quote" style="margin-top:14px">«Цитата из обращения муфтия — одна-две строки крупным курсивом.»</div>
    <div style="margin-top:22px;font-size:15.5px;font-weight:600">[Имя муфтия]</div><div class="meta">Муфтий Пензенской области</div>
    <div style="display:flex;gap:12px;margin-top:28px"><span class="btn btn-night">Все обращения</span><span class="btn btn-line">${ic('telegram')}Telegram-канал</span></div></div></div>
 </div>
 <footer class="foot"><div class="wrap fcols">
